spring:
  datasource:
    url: jdbc:h2:mem:booking_dev;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    root: INFO
    com.labequip: DEBUG
