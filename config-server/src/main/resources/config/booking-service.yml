server:
  port: 8081

spring:
  application:
    name: booking-service
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

feign:
  client:
    config:
      equipment-service:
        connect-timeout: 2000
        read-timeout: 2000

resilience4j:
  circuitbreaker:
    instances:
      equipmentService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      equipmentService:
        max-attempts: 3
        wait-duration: 500ms

labequip:
  messaging:
    exchange: lab-equipment-exchange
    maintenance-requested-routing-key: maintenance.requested

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  health:
    circuitbreakers:
      enabled: true
